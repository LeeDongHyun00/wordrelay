services:
  - type: web
    name: wordrelay
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/LeeDongHyun00/wordrelay
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: RUST_LOG
        value: wordrelay=info
